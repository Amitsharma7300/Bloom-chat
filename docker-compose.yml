services:
  api:
    build: ./BACKEND
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?Set BILLING_WEBHOOK_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      AD_PROBE_SECRET: ${AD_PROBE_SECRET:?Set AD_PROBE_SECRET}
      CREATOR_IMAGE_KEY: ${CREATOR_IMAGE_KEY:-}
      CREATOR_VERIFY_URL: ${CREATOR_VERIFY_URL:-}
      CREATOR_VERIFY_TOKEN: ${CREATOR_VERIFY_TOKEN:-}
      COIN_BILLING_WEBHOOK_SECRET: ${COIN_BILLING_WEBHOOK_SECRET:-}
      TURN_URL: ${TURN_URL:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
    ports:
      - "5000:5000"
    volumes:
      - bloom-data:/app/data

volumes:
  bloom-data:
